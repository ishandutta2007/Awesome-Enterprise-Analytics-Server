<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A13" />
      <stop offset="45%" stop-color="#0E172A" />
      <stop offset="85%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes wave-flow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1200; }
    }
    @keyframes bar-pulse {
      0%, 100% { transform: scaleY(1); opacity: 0.7; }
      50% { transform: scaleY(1.22); opacity: 0.95; }
    }
    @keyframes float-pill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes shimmer-line {
      0% { stroke-dashoffset: 600; opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }

    .pulse-blob-1 {
      animation: pulse-glow 9s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .pulse-blob-2 {
      animation: pulse-glow 11s ease-in-out infinite alternate;
      transform-origin: 1050px 250px;
    }
    .wave-line-1 {
      stroke-dasharray: 24 12;
      animation: wave-flow 45s linear infinite;
    }
    .wave-line-2 {
      stroke-dasharray: 600;
      animation: shimmer-line 7s ease-in-out infinite;
    }
    .bar-1 { animation: bar-pulse 3.8s ease-in-out infinite; transform-origin: 880px 290px; }
    .bar-2 { animation: bar-pulse 4.4s ease-in-out infinite 0.7s; transform-origin: 920px 290px; }
    .bar-3 { animation: bar-pulse 3.2s ease-in-out infinite 1.3s; transform-origin: 960px 290px; }
    .bar-4 { animation: bar-pulse 4.9s ease-in-out infinite 0.4s; transform-origin: 1000px 290px; }
    .bar-5 { animation: bar-pulse 3.6s ease-in-out infinite 1.8s; transform-origin: 1040px 290px; }
    .pill-group { animation: float-pill 5s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1280" height="380" fill="url(#bg-grad)" rx="16" />

  <!-- Background Grid -->
  <rect width="1280" height="380" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Background Blobs (Behind all text) -->
  <g opacity="0.6">
    <circle class="pulse-blob-1" cx="220" cy="90" r="140" fill="#3B82F6" opacity="0.3" filter="url(#glow-strong)" />
    <circle class="pulse-blob-2" cx="1060" cy="270" r="160" fill="#8B5CF6" opacity="0.35" filter="url(#glow-strong)" />
    <circle cx="680" cy="340" r="180" fill="#06B6D4" opacity="0.15" filter="url(#glow-strong)" />
  </g>

  <!-- Dynamic Background Analytics Charts / Data Waves (Behind Text) -->
  <g opacity="0.45">
    <!-- Trend wave lines -->
    <path class="wave-line-1" d="M 0 310 Q 300 240, 600 290 T 1280 230" fill="none" stroke="#38BDF8" stroke-width="2.5" opacity="0.6" />
    <path class="wave-line-2" d="M 0 330 Q 320 270, 640 310 T 1280 250" fill="none" stroke="#A855F7" stroke-width="3" opacity="0.7" />
    
    <!-- Animated Chart Bars in Right Background -->
    <rect class="bar-1" x="870" y="210" width="22" height="80" rx="4" fill="url(#bar-grad)" />
    <rect class="bar-2" x="910" y="170" width="22" height="120" rx="4" fill="url(#bar-grad)" />
    <rect class="bar-3" x="950" y="195" width="22" height="95" rx="4" fill="url(#bar-grad)" />
    <rect class="bar-4" x="990" y="140" width="22" height="150" rx="4" fill="url(#bar-grad)" />
    <rect class="bar-5" x="1030" y="165" width="22" height="125" rx="4" fill="url(#bar-grad)" />
    <rect x="1070" y="130" width="22" height="160" rx="4" fill="url(#bar-grad)" opacity="0.6" />
    <rect x="1110" y="180" width="22" height="110" rx="4" fill="url(#bar-grad)" opacity="0.5" />
    
    <!-- Sparklines on bottom right -->
    <polyline points="870,205 910,165 950,190 990,135 1030,160 1070,125 1110,175 1140,150" fill="none" stroke="#F43F5E" stroke-width="2" opacity="0.8" />
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed Crisp, Legible, and Above Everything -->
  <g id="foreground-content">
    <!-- Category Super-Title / Badge -->
    <g transform="translate(80, 56)">
      <rect width="250" height="32" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" opacity="0.9" />
      <circle cx="18" cy="16" r="5" fill="#10B981" />
      <text x="32" y="21" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#E2E8F0" letter-spacing="0.8">ENTERPRISE BI ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="80" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" letter-spacing="-0.8">
      Awesome Enterprise
    </text>
    <text x="80" y="194" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="url(#cyan-blue)" letter-spacing="-0.8">
      Analytics Server
    </text>

    <!-- Subtitle -->
    <text x="80" y="238" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94A3B8">
      Curated Directory of Self-Hosted BI, Data Visualization, Semantic Layers &amp; OLAP Engines
    </text>

    <!-- Foreground Dynamic Interactive Pills -->
    <g class="pill-group" transform="translate(80, 276)">
      <!-- Pill 1: SaaS Leaders -->
      <g transform="translate(0, 0)">
        <rect width="140" height="36" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
        <rect x="0" y="0" width="140" height="36" rx="10" fill="#3B82F6" opacity="0.12" />
        <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#60A5FA">🏢 SaaS Giants</text>
      </g>

      <!-- Pill 2: Open Source BI -->
      <g transform="translate(152, 0)">
        <rect width="156" height="36" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
        <rect x="0" y="0" width="156" height="36" rx="10" fill="#10B981" opacity="0.12" />
        <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#34D399">🚀 Open-Source BI</text>
      </g>

      <!-- Pill 3: Self-Hosted -->
      <g transform="translate(320, 0)">
        <rect width="138" height="36" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
        <rect x="0" y="0" width="138" height="36" rx="10" fill="#8B5CF6" opacity="0.12" />
        <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#A78BFA">🔒 Self-Hosted</text>
      </g>

      <!-- Pill 4: Warehouse-Native -->
      <g transform="translate(470, 0)">
        <rect width="180" height="36" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
        <rect x="0" y="0" width="180" height="36" rx="10" fill="#F59E0B" opacity="0.12" />
        <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FBBF24">⚡ Warehouse-Native</text>
      </g>

      <!-- Pill 5: Real-Time OLAP -->
      <g transform="translate(662, 0)">
        <rect width="158" height="36" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
        <rect x="0" y="0" width="158" height="36" rx="10" fill="#EC4899" opacity="0.12" />
        <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F472B6">📊 Real-Time OLAP</text>
      </g>
    </g>
  </g>
</svg>
